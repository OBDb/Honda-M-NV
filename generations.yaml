    description: "The Honda M-NV is a compact all-electric SUV developed specifically for the Chinese market through Honda's joint venture with Dongfeng Honda. Marketed under the Ciimo brand, it is based on the Honda XR-V (the Chinese market version of the HR-V/Vezel) but extensively modified for electric propulsion, featuring distinctive EV-specific styling elements. The exterior design incorporates a closed-off front grille typical of electric vehicles, unique LED lighting signatures, aerodynamic wheels, and blue accents signifying its electric powertrain. Powered by a single electric motor producing approximately 134 HP (100 kW) and 280 Nm of torque, it delivers adequate performance for urban and suburban use. The lithium-ion battery pack (approximately 53.6 kWh in capacity) enables a claimed range of about 400 km on the NEDC test cycle. The interior features a 12.3-inch TFT instrument cluster and push-button gear selector, with EV-specific displays and controls. Available with various driver assistance technologies including adaptive cruise control and lane keeping assistance, it offers safety features comparable to Honda's global models. The M-NV was revealed in November 2020 for the 2021 model year and represents Honda's effort to establish a presence in China's rapidly growing electric vehicle market while meeting the country's stringent NEV (New Energy Vehicle) requirements."